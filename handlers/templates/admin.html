<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - TFSA Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-bold text-indigo-400">TFSA Tracker</span>
            <span class="bg-rose-500/10 text-rose-400 text-xs font-semibold px-2.5 py-1 rounded-full border border-rose-500/20">Admin Management</span>
        </div>
        <div class="flex items-center space-x-4">
            <a href="/dashboard" class="text-sm font-medium text-slate-300 hover:text-slate-100 transition">User Dashboard</a>
            <a href="/logout" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200 transition">Logout</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-8 space-y-6">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-sm">
            <h3 class="text-xl font-bold text-slate-100 mb-4">User Account Approvals</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-xs font-medium text-slate-400 uppercase">
                            <th class="py-3 px-2">ID</th>
                            <th class="py-3 px-2">Email</th>
                            <th class="py-3 px-2">Role</th>
                            <th class="py-3 px-2">Status</th>
                            <th class="py-3 px-2 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/50 text-sm">
                        {{range .Users}}
                        <tr class="hover:bg-slate-750 transition">
                            <td class="py-3 px-2 text-slate-400">#{{.ID}}</td>
                            <td class="py-3 px-2 font-medium text-slate-200">{{.Email}}</td>
                            <td class="py-3 px-2 text-slate-300">{{.Role}}</td>
                            <td class="py-3 px-2">
                                {{if eq .Status "APPROVED"}}
                                    <span class="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-2 py-0.5 rounded">APPROVED</span>
                                {{else}}
                                    <span class="bg-amber-500/10 text-amber-400 text-xs font-semibold px-2 py-0.5 rounded">PENDING</span>
                                {{end}}
                            </td>
                            <td class="py-3 px-2 text-right space-x-2">
                                {{if ne .Status "APPROVED"}}
                                <form action="/admin/approve" method="POST" class="inline">
                                    <input type="hidden" name="user_id" value="{{.ID}}">
                                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded font-medium transition">Approve</button>
                                </form>
                                {{end}}
                            </td>
                        </tr>
                        {{else}}
                        <tr>
                            <td colspan="5" class="py-8 text-center text-slate-500">No users found.</td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
